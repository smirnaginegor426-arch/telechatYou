name: Check web build

on:
  push:
    branches:
      - "**"
    paths:
      - "src/**"
      - "api/**"
      - "db/**"
      - "package.json"
      - "package-lock.json"
      - "*.json"
      - "*.ts"
      - "*.tsx"
      - "README.md"
      - ".env.example"
      - ".github/workflows/check-web-build.yml"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-build:
    name: TypeScript check and web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run check
      - name: Build web and server bundles
        run: npm run build
