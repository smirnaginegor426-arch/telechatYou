name: Keep TeleChat You Render service awake

on:
  # External traffic is required; the sleeping Render process cannot wake itself.
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send a lightweight HTTP request to Render
        env:
          RENDER_URL: https://telechatyou-1.onrender.com/
        run: |
          set -eu
          echo "Pinging Render service..."
          status=$(curl --location --silent --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --connect-timeout 15 \
            --max-time 100 \
            "$RENDER_URL")
          echo "Render returned HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "Unexpected HTTP status from Render: $status"
            exit 1
          fi
