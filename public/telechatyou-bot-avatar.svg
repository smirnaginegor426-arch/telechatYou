<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#078cff"/>
      <stop offset="1" stop-color="#0069ee"/>
    </linearGradient>
    <linearGradient id="letters" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e6ffff"/>
      <stop offset="0.48" stop-color="#8cf2ff"/>
      <stop offset="1" stop-color="#30c9fa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" fill="#1710a6"/>
  <rect x="0" y="0" width="128" height="128" fill="#1509a4" opacity=".22"/>
  <g fill="url(#blue)">
    <rect x="22" y="26" width="84" height="39" rx="19.5"/>
    <circle cx="41.5" cy="45.5" r="19.5"/>
    <circle cx="86.5" cy="45.5" r="19.5"/>
    <rect x="22" y="62" width="84" height="40" rx="20"/>
    <circle cx="42" cy="82" r="20"/>
    <circle cx="86" cy="82" r="20"/>
  </g>
  <g fill="url(#letters)" font-family="Impact, 'Arial Narrow', sans-serif" font-weight="900" text-anchor="middle" filter="url(#glow)">
    <text x="64" y="49" font-size="21" textLength="73" lengthAdjust="spacingAndGlyphs">TELECHAT</text>
    <text x="64" y="94" font-size="35" textLength="45" lengthAdjust="spacingAndGlyphs">YOU</text>
  </g>
</svg>